<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-page</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/javascript/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Audiowide&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Goldman:wght@400;700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Pau+Cin+Hau&family=Orbitron:wght@400..900&family=Petit+Formal+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira+Stencil:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Tai+Heritage+Pro:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <main class="login-page">
            <header class="login-header">
                <img src="/assets/logo.svg" alt="logo" class="logo">
                <h1>Sign in to your account</h1>
                <p class="header-para">Enter your email and password to log in</p>
            </header>
            
            <form class="login-form">
                <div class="input-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="input-form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>
                
                <div class="password-cta">
                    <a href="#" class="password-link">Forgot your password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            
            </form>

            <section class="login-footer">
                <div class="footer-or">
                    <span>or</span>
                </div>
                
                <div class="login-footer-btns">
                    <a class="login-footer-btn" href="#">
                        <img src="/assets/google-icon.svg" alt="google logo" class="icon">
                    </a>
                    <a class="login-footer-btn" href="#">
                        <img src="/assets/facebook-icon.svg" alt="facebook logo" class="icon">
                    </a>
                </div>
                
                <div class="sign-up"></div>
                    <p class="account-cta">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
                </div>
            </section>

    </main>
</body>
</html>
